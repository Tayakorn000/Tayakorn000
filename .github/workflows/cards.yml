name: Update profile cards

on:
  schedule:
    - cron: "0 19 * * *" # 02:00 Bangkok
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cards.yml

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fail_on_error keeps yesterday's card instead of committing an error card
      - name: Stats (light)
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Tayakorn000&count_private=true&show_icons=true&hide_rank=true&hide_border=true&hide=stars&custom_title=GitHub stats&theme=default
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true
      - name: Stats (dark)
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Tayakorn000&count_private=true&show_icons=true&hide_rank=true&hide_border=true&hide=stars&custom_title=GitHub stats&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Top languages (light)
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Tayakorn000&layout=compact&langs_count=8&hide=tex&hide_border=true&custom_title=Most used languages&theme=default
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true
      - name: Top languages (dark)
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Tayakorn000&layout=compact&langs_count=8&hide=tex&hide_border=true&custom_title=Most used languages&theme=github_dark
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Streak (light)
        uses: DenverCoder1/github-readme-streak-stats@v1.8.2
        with:
          options: user=Tayakorn000&hide_border=true&disable_animations=true&background=FFFFFF&ring=1A7F37&fire=1A7F37&currStreakLabel=1A7F37&stroke=D0D7DE
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN }}
      - name: Streak (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1.8.2
        with:
          options: user=Tayakorn000&hide_border=true&disable_animations=true&background=0D1117&ring=3FB950&fire=3FB950&currStreakLabel=3FB950&currStreakNum=E6EDF3&sideNums=E6EDF3&sideLabels=8B949E&dates=8B949E&stroke=30363D
          path: profile/streak-dark.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Snake
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: Tayakorn000
          github_token: ${{ secrets.STATS_TOKEN }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Update profile cards" || exit 0
          git push
